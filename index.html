<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="설치·회원가입 없이 바로 하는 무료 게임 모음. 스도쿠, 2048, 카드 짝맞추기, 지뢰찾기, 블록 쌓기, 스네이크, 오목, 벽돌깨기, 점프 러너, 리버시. 매일 도전과 연속 출석.">
  <meta name="theme-color" content="#f5f3ee">
  <meta property="og:title" content="매일게임 — 오늘도, 가볍게 한 판">
  <meta property="og:description" content="설치 없이 바로 하는 무료 두뇌 게임. 오늘의 도전에 참여해 보세요!">
  <meta property="og:type" content="website">
  <title>매일게임 — 오늘도, 가볍게 한 판</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231e6b48'/%3E%3Crect x='22' y='22' width='24' height='24' rx='5' fill='white'/%3E%3Crect x='54' y='22' width='24' height='24' rx='5' fill='white' opacity='.55'/%3E%3Crect x='22' y='54' width='24' height='24' rx='5' fill='white' opacity='.55'/%3E%3Crect x='54' y='54' width='24' height='24' rx='5' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="common/base.css">
  <link rel="stylesheet" href="common/thumbs.css">
  <link rel="stylesheet" href="hub.css">
  <!-- 화면이 그려지기 전에 어두운 화면·큰 글씨 설정을 먼저 적용해 깜빡임을 막는다 -->
  <script>
    try {
      var s = JSON.parse(localStorage.getItem('maeil-game.settings.v1') || localStorage.getItem('maeil-sudoku.settings.v1') || '{}');
      var dark = typeof s.dark === 'boolean' ? s.dark : matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      if (s.largeText) document.documentElement.classList.add('large-text');
    } catch (e) {}
  </script>
  <!-- 애드센스 승인 후(도메인 연결 뒤), 애드센스에서 받은 <script ...adsbygoogle.js...> 한 줄을 여기에 붙여넣으세요 -->
</head>
<body>
  <main class="hub">
    <header class="hub-header">
      <div>
        <h1 class="hub-title">매일게임</h1>
        <p class="hub-tagline">오늘도, 가볍게 한 판.</p>
      </div>
      <div class="hub-settings" role="group" aria-label="화면 설정">
        <button type="button" class="set-btn large-text-toggle" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18 9 5h1.6l5 13M6 13.5h7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M16.5 18v-5.2M14 12.8h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>큰 글씨</button>
        <button type="button" class="set-btn dark-toggle" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>어두운 화면</button>
        <button type="button" class="set-btn sound-toggle" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M15.5 9a4.5 4.5 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>소리</button>
      </div>
    </header>

    <!-- 오늘의 도전: 연속 출석 + 오늘의 추천 한 판(날짜로 정해 누구나 같은 게임). 하나만 해도 출석이 이어진다 -->
    <section class="today-card" aria-labelledby="today-title">
      <div class="today-row">
        <h2 class="today-title" id="today-title">오늘의 도전 <span class="today-date" id="today-date"></span></h2>
        <span class="streak" id="streak"></span>
      </div>
      <p class="today-msg" id="today-msg"></p>
      <a class="today-pick" id="today-pick" href="./">
        <span class="today-thumb" id="today-thumb" aria-hidden="true"></span>
        <span class="today-pick-body">
          <small id="today-pick-label">오늘의 추천</small>
          <strong id="today-pick-name"></strong>
          <span class="today-pick-desc" id="today-pick-desc"></span>
        </span>
        <span class="today-go" id="today-go">도전하기 →</span>
      </a>
    </section>

    <h2 class="section-title">전체 게임</h2>
    <ul class="game-grid" id="game-grid"></ul>

    <section id="soon-wrap" hidden>
      <h2 class="section-title">곧 만나요</h2>
      <ul class="soon-list" id="soon-list"></ul>
    </section>

    <!-- 광고 자리: 애드센스 광고 코드(<ins class="adsbygoogle" ...> 부분)를 이 안에 붙여넣으세요. 비어 있으면 화면에 보이지 않습니다. -->
    <aside class="ad-slot" aria-label="광고"></aside>

    <footer class="hub-footer">
      <p><a href="guide/" class="footer-link">게임 방법·요령</a></p>
      <p><a href="about.html">소개</a> · <a href="privacy.html">개인정보처리방침</a></p>
      <p>기록은 이 기기의 브라우저에만 저장돼요 · 설치·회원가입 없음</p>
    </footer>
  </main>

  <script src="common/core.js"></script>
  <script src="common/thumbs.js"></script>
  <script src="common/fx.js"></script>
  <script src="hub.js"></script>
</body>
</html>
