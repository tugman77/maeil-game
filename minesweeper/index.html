<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="설치 없이 바로 하는 무료 지뢰찾기. 휴대폰은 열기/깃발 버튼으로 편하게. 매일 도전은 모두 같은 판.">
  <meta name="theme-color" content="#f4f1ea">
  <meta property="og:title" content="지뢰찾기 — 매일게임">
  <meta property="og:description" content="숫자 힌트로 지뢰 피하기. 오늘의 도전에 참여해 보세요!">
  <meta property="og:type" content="website">
  <title>지뢰찾기 — 매일게임</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23475569'/%3E%3Ccircle cx='50' cy='54' r='22' fill='white'/%3E%3Crect x='47' y='18' width='6' height='16' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="../common/base.css">
  <link rel="stylesheet" href="../common/game.css">
  <link rel="stylesheet" href="style.css">
  <script>
    try {
      var s = JSON.parse(localStorage.getItem('maeil-game.settings.v1') || localStorage.getItem('maeil-sudoku.settings.v1') || '{}');
      var dark = typeof s.dark === 'boolean' ? s.dark : matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      if (s.largeText) document.documentElement.classList.add('large-text');
    } catch (e) {}
  </script>
</head>
<body>
  <!-- 시작 화면 -->
  <main id="start-screen" class="screen start-screen">
    <a href="../" class="hub-link">← 매일게임 · 다른 게임</a>
    <h1 class="title">지뢰찾기</h1>
    <p class="howto">숫자는 주변 8칸에 있는 지뢰 수예요. 지뢰가 없는 칸을 모두 열면 성공!</p>

    <button type="button" id="daily-btn" class="daily-btn">
      <span class="daily-main">📅 오늘의 도전</span>
      <small id="daily-info"></small>
    </button>

    <div id="continue-wrap" class="continue-wrap" hidden>
      <button type="button" id="continue-btn" class="primary-btn continue-btn">▶ 이어하기<small id="continue-info"></small></button>
      <p class="note-text">새 게임을 시작하면 하던 게임은 사라져요</p>
    </div>

    <p class="subtitle">새 게임 · 난이도를 고르세요</p>
    <div class="difficulty-list" id="difficulty-list"></div>

    <div class="option-row">
      <button type="button" class="option-btn large-text-toggle" aria-pressed="false">가 큰 글씨</button>
      <button type="button" class="option-btn dark-toggle" aria-pressed="false">🌙 어두운 화면</button>
    </div>
    <a href="../guide/minesweeper.html" class="hub-link">📖 지뢰찾기 하는 법·요령</a>

    <aside class="ad-slot" aria-label="광고"></aside>
  </main>

  <!-- 게임 화면 -->
  <main id="game-screen" class="screen game-screen" hidden>
    <header class="game-header">
      <button type="button" id="home-btn" class="header-btn">← 처음</button>
      <div class="header-stats">
        <div class="stat-box"><small>시간</small><b id="timer">00:00</b></div>
        <div class="stat-box"><small>남은 🚩</small><b id="flags">0</b></div>
      </div>
      <button type="button" id="pause-btn" class="header-btn">⏸ 정지</button>
    </header>
    <p id="game-label" class="game-label"></p>

    <div class="board-area">
      <div id="board" class="board" role="grid" aria-label="지뢰찾기 판"></div>
      <div id="pause-overlay" class="pause-overlay" hidden>
        <p class="pause-title">일시정지</p>
        <button type="button" id="resume-btn" class="primary-btn">▶ 계속하기</button>
      </div>
    </div>

    <div class="mode-switch" role="group" aria-label="누르면 할 일">
      <button type="button" id="mode-open" class="mode-btn" aria-pressed="true">⛏ 열기</button>
      <button type="button" id="mode-flag" class="mode-btn" aria-pressed="false">🚩 깃발</button>
    </div>
    <p class="note-text">PC: 왼쪽 클릭 열기 · 오른쪽 클릭 깃발 · 숫자 칸을 누르면 주변을 한 번에 열어요</p>
  </main>

  <!-- 결과 화면 -->
  <main id="result-screen" class="screen result-screen" hidden>
    <p class="result-emoji" id="result-emoji" aria-hidden="true">🎉</p>
    <h2 class="result-title" id="result-title">성공!</h2>
    <p class="result-sub" id="result-sub"></p>
    <div class="result-card">
      <p class="result-label" id="result-label">걸린 시간</p>
      <p class="result-big" id="result-time">00:00</p>
      <p class="result-best" id="result-best"></p>
    </div>
    <button type="button" id="view-btn" class="secondary-btn">🔍 판 다시 보기</button>
    <button type="button" id="share-btn" class="primary-btn">📤 결과 공유하기</button>
    <div class="button-pair">
      <button type="button" id="again-btn" class="secondary-btn">새 게임</button>
      <button type="button" id="result-home-btn" class="secondary-btn">처음으로</button>
    </div>
    <aside class="ad-slot" aria-label="광고"></aside>
  </main>

  <script src="../common/core.js"></script>
  <script src="js/logic.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
