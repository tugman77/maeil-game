<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="한국 한자, 중국어 한자, 일본어 한자를 읽고 쓰고 들으며 익히는 짧은 학습 게임입니다.">
  <meta name="theme-color" content="#f5f3ee">
  <meta property="og:title" content="오늘의 한자 — 매일게임">
  <meta property="og:description" content="한자를 읽고, 획순을 따라 쓰고, 소리를 들으며 익혀 보세요.">
  <meta property="og:type" content="website">
  <title>오늘의 한자 — 매일게임</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231e6b48'/%3E%3Ctext x='32' y='46' text-anchor='middle' fill='white' font-size='42' font-weight='700'%3E漢%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="../common/base.css">
  <link rel="stylesheet" href="../common/game.css">
  <link rel="stylesheet" href="../common/thumbs.css">
  <link rel="stylesheet" href="../common/start.css">
  <link rel="stylesheet" href="style.css">
  <script>
    try {
      var s = JSON.parse(localStorage.getItem('maeil-game.settings.v1') || localStorage.getItem('maeil-sudoku.settings.v1') || '{}');
      var dark = typeof s.dark === 'boolean' ? s.dark : matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      if (s.largeText) document.documentElement.classList.add('large-text');
    } catch (e) {}
  </script>
</head>
<body>
  <main id="start-screen" class="st">
    <a href="../" class="st-back">← 게임 목록</a>
    <header><h1 class="st-title">오늘의 한자</h1><p class="st-desc">읽고, 획순을 따라 쓰고, 소리를 들으며 한자를 익혀 보세요.</p></header>
    <div class="st-hero thumb-hanja" id="hero">
      <div class="st-preview" id="preview" aria-hidden="true"></div>
      <button type="button" id="daily-btn" class="st-daily"><span class="st-daily-text"><b>오늘의 도전</b><small id="daily-info"></small></span><span class="st-daily-go" id="daily-go">도전하기 →</span></button>
    </div>
    <div class="st-ask" id="sound-ask" hidden><span>효과음을 켤까요?</span><button type="button" id="sound-yes" class="st-ask-yes">켜기</button><button type="button" id="sound-no" class="st-ask-no">괜찮아요</button></div>
    <div id="continue-wrap" hidden><button type="button" id="continue-btn" class="st-continue">▶ 이어하기<small id="continue-info"></small></button><p class="st-note">진행은 이 기기에 저장돼요</p></div>
    <section class="st-pick" aria-labelledby="language-label">
      <h2 class="st-label" id="language-label">학습 언어</h2>
      <div class="choice-chips" id="language-list" role="radiogroup" aria-label="학습 언어"></div>
      <h2 class="st-label mode-label">연습 방법</h2>
      <div class="choice-chips" id="mode-list" role="radiogroup" aria-label="연습 방법"></div>
      <h2 class="st-label mode-label" id="pick-label">난이도</h2>
      <div class="st-choices" id="difficulty-list" role="radiogroup" aria-labelledby="pick-label"></div>
      <p class="st-detail" id="pick-detail"></p>
      <button type="button" id="start-btn" class="st-start">게임 시작</button>
      <p class="st-best"><span id="pick-best"></span></p>
    </section>
    <div id="daily-done-slot"></div>
    <div class="st-tools">
      <button type="button" class="st-tool large-text-toggle" aria-pressed="false">큰 글씨</button>
      <button type="button" class="st-tool dark-toggle" aria-pressed="false">어두운 화면</button>
      <button type="button" class="st-tool sound-toggle" aria-pressed="false">소리</button>
      <a class="st-tool" href="../guide/hanja.html">도움말</a>
    </div>
    <aside class="ad-slot" aria-label="광고"></aside>
  </main>

  <main id="game-screen" class="screen game-screen hanja-screen" hidden>
    <header class="game-header"><button type="button" id="home-btn" class="header-btn">처음</button><div class="header-stats"><div class="stat-box"><small>문제</small><b id="question-number">1/5</b></div><div class="stat-box"><small>맞힘</small><b id="correct-count">0</b></div></div><button type="button" id="pause-btn" class="header-btn">잠시 쉬기</button></header>
    <p id="game-label" class="game-label"></p>
    <section class="lesson-card" aria-labelledby="prompt-label">
      <p id="prompt-label" class="prompt-label"></p>
      <p id="lesson-hanzi" class="lesson-hanzi" lang="zh-Hans"></p>
      <p id="lesson-word" class="lesson-word"></p>
      <button type="button" id="speak-btn" class="speak-btn" aria-label="발음 듣기">🔊 <span>발음 듣기</span></button>
      <p id="audio-note" class="audio-note" role="status"></p>
      <div id="answer-list" class="answer-list" role="group" aria-label="답안 보기"></div>
      <div id="writing-area" class="writing-area" hidden>
        <p id="writing-instruction" class="writing-instruction">연한 선을 손가락으로 따라 쓰세요.</p>
        <svg id="writing-board" class="writing-board" viewBox="0 0 120 140" aria-label="한자 획순 따라 쓰기"><defs><marker id="write-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" class="write-arrow-head"/></marker></defs><rect x="4" y="4" width="112" height="132" rx="12" class="write-paper"/><path d="M60 8V132M8 70H112" class="write-guide"/><text id="write-target" x="60" y="103" class="write-target" text-anchor="middle"></text><g id="stroke-paths"></g><circle id="stroke-start" r="3.5" class="stroke-start"/><path id="active-stroke" class="active-stroke" d=""/><path id="user-stroke" class="user-stroke" d=""/></svg>
        <div class="writing-actions"><button type="button" id="clear-stroke-btn" class="secondary-btn">다시 쓰기</button><button type="button" id="show-stroke-btn" class="secondary-btn">획순 보기</button></div>
      </div>
      <p id="answer-feedback" class="answer-feedback" role="status" aria-live="polite"></p>
      <section id="answer-note" class="answer-note" hidden><h2 id="answer-title"></h2><p id="answer-detail"></p><button type="button" id="next-btn" class="primary-btn">다음 문제</button></section>
    </section>
    <p class="game-reminder">시간 제한 없음 · 발음은 다시 들을 수 있어요</p>
  </main>

  <main id="pause-screen" class="screen pause-screen" hidden><h1>잠깐 쉬어 가세요</h1><p>진행은 자동으로 저장됩니다.</p><button type="button" id="resume-btn" class="primary-btn">계속하기</button><button type="button" id="pause-home-btn" class="secondary-btn">처음으로</button></main>

  <main id="result-screen" class="screen result-screen" hidden><p class="result-emoji" aria-hidden="true">漢</p><h1 id="result-title" class="result-title">오늘의 한자</h1><p id="result-sub" class="result-sub"></p><section class="result-card"><p class="result-label">맞힌 문제</p><p id="result-score" class="result-big"></p><p id="result-detail" class="result-detail"></p><p id="result-best" class="result-best"></p></section><ol id="review-list" class="review-list" aria-label="오늘 익힌 글자"></ol><button type="button" id="again-btn" class="primary-btn">다시 연습하기</button><div class="button-pair"><button type="button" id="share-btn" class="secondary-btn">결과 공유</button><button type="button" id="result-home-btn" class="secondary-btn">처음으로</button></div><p class="record-note">연습 기록은 이 기기의 브라우저에 저장됩니다.</p><aside class="ad-slot" aria-label="광고"></aside></main>
  <script src="../common/core.js"></script><script src="../common/thumbs.js"></script><script src="../common/start.js"></script><script src="../common/fx.js"></script><script src="js/bank.js"></script><script src="js/logic.js"></script><script src="js/ui.js"></script>
</body>
</html>
