<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="설치 없이 바로 하는 무료 2048. 같은 숫자를 밀어 합쳐 2048을 만들어 보세요. 매일 도전은 모두 같은 판.">
  <meta name="theme-color" content="#f4f1ea">
  <meta property="og:title" content="2048 — 매일게임">
  <meta property="og:description" content="같은 숫자를 밀어 합치기. 오늘의 도전에 참여해 보세요!">
  <meta property="og:type" content="website">
  <title>2048 — 매일게임</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23e8a33d'/%3E%3Ctext x='50' y='64' font-size='34' font-family='sans-serif' font-weight='800' fill='white' text-anchor='middle'%3E2048%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="../common/base.css">
  <link rel="stylesheet" href="../common/game.css">
  <link rel="stylesheet" href="style.css">
  <script>
    try {
      var s = JSON.parse(localStorage.getItem('maeil-game.settings.v1') || localStorage.getItem('maeil-sudoku.settings.v1') || '{}');
      var dark = typeof s.dark === 'boolean' ? s.dark : matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      if (s.largeText) document.documentElement.classList.add('large-text');
    } catch (e) {}
  </script>
</head>
<body>
  <!-- 시작 화면 -->
  <main id="start-screen" class="screen start-screen">
    <a href="../" class="hub-link">← 매일게임 · 다른 게임</a>
    <h1 class="title">2048</h1>
    <p class="howto">화면을 밀어 같은 숫자를 합치세요. 2048을 만들면 성공!</p>

    <button type="button" id="daily-btn" class="daily-btn">
      <span class="daily-main">📅 오늘의 도전</span>
      <small id="daily-info"></small>
    </button>

    <div id="continue-wrap" class="continue-wrap" hidden>
      <button type="button" id="continue-btn" class="primary-btn continue-btn">▶ 이어하기<small id="continue-info"></small></button>
      <p class="note-text">새 게임을 시작하면 하던 게임은 사라져요</p>
    </div>

    <p class="subtitle">새 게임 · 난이도를 고르세요</p>
    <div class="difficulty-list" id="difficulty-list"></div>

    <div class="option-row">
      <button type="button" class="option-btn large-text-toggle" aria-pressed="false">가 큰 글씨</button>
      <button type="button" class="option-btn dark-toggle" aria-pressed="false">🌙 어두운 화면</button>
    </div>
    <a href="../guide/2048.html" class="hub-link">📖 2048 하는 법·요령</a>

    <!-- 광고 자리: 비어 있으면 화면에 보이지 않습니다. 게임 화면에는 두지 않습니다. -->
    <aside class="ad-slot" aria-label="광고"></aside>
  </main>

  <!-- 게임 화면 -->
  <main id="game-screen" class="screen game-screen" hidden>
    <header class="game-header">
      <button type="button" id="home-btn" class="header-btn">← 처음</button>
      <div class="header-stats">
        <div class="stat-box"><small>점수</small><b id="score">0</b></div>
        <div class="stat-box"><small>최고</small><b id="best">0</b></div>
      </div>
    </header>
    <p id="game-label" class="game-label"></p>

    <div class="board-area" id="board-area">
      <div id="board" class="board" role="grid" aria-label="2048 판"></div>
    </div>

    <div class="tool-row">
      <button type="button" id="undo-btn" class="header-btn">↶ 되돌리기</button>
      <button type="button" id="restart-btn" class="header-btn">↻ 새로</button>
      <button type="button" id="end-btn" class="header-btn">■ 그만하기</button>
    </div>
    <p class="note-text">위·아래·왼쪽·오른쪽으로 밀기 · PC는 방향키</p>
  </main>

  <!-- 결과 화면 -->
  <main id="result-screen" class="screen result-screen" hidden>
    <p class="result-emoji" id="result-emoji" aria-hidden="true">🎉</p>
    <h2 class="result-title" id="result-title">게임 끝!</h2>
    <p class="result-sub" id="result-sub"></p>
    <div class="result-card">
      <p class="result-label">점수</p>
      <p class="result-big" id="result-score">0</p>
      <p class="result-detail" id="result-detail"></p>
      <p class="result-best" id="result-best"></p>
    </div>
    <button type="button" id="share-btn" class="primary-btn">📤 결과 공유하기</button>
    <div class="button-pair">
      <button type="button" id="again-btn" class="secondary-btn">새 게임</button>
      <button type="button" id="result-home-btn" class="secondary-btn">처음으로</button>
    </div>
    <aside class="ad-slot" aria-label="광고"></aside>
  </main>

  <script src="../common/core.js"></script>
  <script src="js/logic.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
