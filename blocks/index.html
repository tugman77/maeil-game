<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="설치 없이 바로 하는 무료 블록 쌓기. 떨어지는 블록으로 가로줄을 채워 없애 보세요. 큰 버튼으로 휴대폰에서도 편하게, 매일 도전은 모두 같은 블록 순서.">
  <meta name="theme-color" content="#f5f3ee">
  <meta property="og:title" content="블록 쌓기 — 매일게임">
  <meta property="og:description" content="떨어지는 블록으로 줄 없애기. 오늘의 도전에 참여해 보세요!">
  <meta property="og:type" content="website">
  <title>블록 쌓기 — 매일게임</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23e0674f'/%3E%3Crect x='20' y='20' width='28' height='28' rx='5' fill='white'/%3E%3Crect x='52' y='20' width='28' height='28' rx='5' fill='white'/%3E%3Crect x='52' y='52' width='28' height='28' rx='5' fill='white'/%3E%3Crect x='20' y='52' width='28' height='28' rx='5' fill='white' opacity='.5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="../common/base.css">
  <link rel="stylesheet" href="../common/game.css">
  <link rel="stylesheet" href="../common/thumbs.css">
  <link rel="stylesheet" href="../common/start.css">
  <link rel="stylesheet" href="style.css">
  <script>
    try {
      var s = JSON.parse(localStorage.getItem('maeil-game.settings.v1') || localStorage.getItem('maeil-sudoku.settings.v1') || '{}');
      var dark = typeof s.dark === 'boolean' ? s.dark : matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      if (s.largeText) document.documentElement.classList.add('large-text');
    } catch (e) {}
  </script>
</head>
<body>
  <!-- 시작 화면 (공통 구조: common/start.css · start.js, tools/start_screen.py로 생성) -->
  <main id="start-screen" class="st">
    <a href="../" class="st-back">← 게임 목록</a>
    <header>
      <h1 class="st-title">블록 쌓기</h1>
      <p class="st-desc">떨어지는 블록으로 가로줄을 빈틈없이 채워 없애세요.</p>
    </header>
    <div class="st-preview thumb-blocks" id="preview" aria-hidden="true"></div>

    <div id="continue-wrap" hidden>
      <button type="button" id="continue-btn" class="st-continue">▶ 이어하기<small id="continue-info"></small></button>
      <p class="st-note">새 게임을 시작하면 하던 게임은 사라져요</p>
    </div>

    <button type="button" id="daily-btn" class="st-daily">
      <span class="st-daily-text"><b>오늘의 도전</b><small id="daily-info"></small></span>
      <span class="st-daily-go" id="daily-go">도전하기 →</span>
    </button>

    <section class="st-pick" aria-labelledby="pick-label">
      <h2 class="st-label" id="pick-label">난이도</h2>
      <div class="st-choices" id="difficulty-list" role="radiogroup" aria-labelledby="pick-label"></div>
      <p class="st-detail" id="pick-detail"></p>
      <button type="button" id="start-btn" class="st-start">게임 시작</button>
      <p class="st-best"><span id="pick-best"></span></p>
    </section>

    <div class="st-tools">
      <button type="button" class="st-tool large-text-toggle" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18 9 5h1.6l5 13M6 13.5h7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M16.5 18v-5.2M14 12.8h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>큰 글씨</button>
      <button type="button" class="st-tool dark-toggle" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>어두운 화면</button>
      <a class="st-tool" href="../guide/blocks.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9.6 9.3a2.5 2.5 0 1 1 3.4 2.3c-.7.3-1 .8-1 1.5v.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="16.9" r="1.2" fill="currentColor"/></svg>도움말</a>
    </div>

    <!-- 광고 자리: 비어 있으면 화면에 보이지 않습니다. 게임 화면에는 두지 않습니다. -->
    <aside class="ad-slot" aria-label="광고"></aside>
  </main>

  <!-- 게임 화면 -->
  <main id="game-screen" class="screen game-screen blocks-game" hidden>
    <header class="game-header">
      <button type="button" id="home-btn" class="header-btn">← 처음</button>
      <div class="header-stats">
        <div class="stat-box"><small>점수</small><b id="score">0</b></div>
        <div class="stat-box"><small>줄</small><b id="lines">0</b></div>
      </div>
      <button type="button" id="pause-btn" class="header-btn">⏸ 정지</button>
    </header>

    <div class="play-row">
      <div class="board-area" id="board-area">
        <div id="board" class="board" aria-label="블록 쌓기 판"></div>
        <div id="pause-overlay" class="pause-overlay" hidden>
          <p class="pause-title">일시정지</p>
          <button type="button" id="resume-btn" class="primary-btn">▶ 계속하기</button>
        </div>
      </div>
      <aside class="side">
        <p class="side-label">다음</p>
        <div id="next" class="next" aria-label="다음 블록"></div>
        <p class="side-label">단계</p>
        <p class="side-value" id="level">1</p>
        <p class="side-label" id="game-label-short"></p>
      </aside>
    </div>

    <div class="pad" aria-label="조작 버튼">
      <button type="button" class="pad-btn" data-act="left" aria-label="왼쪽으로">◀</button>
      <button type="button" class="pad-btn" data-act="rotate" aria-label="돌리기">↻</button>
      <button type="button" class="pad-btn" data-act="right" aria-label="오른쪽으로">▶</button>
      <button type="button" class="pad-btn" data-act="down" aria-label="한 칸씩 내리기">▼</button>
      <button type="button" class="pad-btn drop" data-act="drop" aria-label="바로 떨어뜨리기">⤓</button>
    </div>
    <p class="note-text">판 위에서: 좌우로 밀면 이동 · 누르면 돌리기 · 아래로 휙 밀면 바로 떨어뜨리기</p>
  </main>

  <!-- 결과 화면 -->
  <main id="result-screen" class="screen result-screen" hidden>
    <p class="result-emoji" aria-hidden="true">🧱</p>
    <h2 class="result-title">게임 끝!</h2>
    <p class="result-sub" id="result-sub"></p>
    <div class="result-card">
      <p class="result-label">점수</p>
      <p class="result-big" id="result-score">0</p>
      <p class="result-detail" id="result-detail"></p>
      <p class="result-best" id="result-best"></p>
    </div>
    <button type="button" id="share-btn" class="primary-btn">📤 결과 공유하기</button>
    <div class="button-pair">
      <button type="button" id="again-btn" class="secondary-btn">새 게임</button>
      <button type="button" id="result-home-btn" class="secondary-btn">처음으로</button>
    </div>
    <aside class="ad-slot" aria-label="광고"></aside>
  </main>

  <script src="../common/core.js"></script>
  <script src="../common/thumbs.js"></script>
  <script src="../common/start.js"></script>
  <script src="js/logic.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
