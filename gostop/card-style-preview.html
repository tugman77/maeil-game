<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111713">
<title>화투패 디자인 시안 | 매일게임</title>
<style>
:root{color-scheme:dark;--bg:#111713;--panel:#1d2621;--line:#35443b;--text:#f2f5f2;--muted:#b4c0b8;--accent:#57d49b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif}
main{width:min(1120px,calc(100% - 32px));margin:0 auto;padding:32px 0 48px}
a{color:var(--accent);text-decoration:none;font-weight:700}.back{display:inline-flex;min-height:44px;align-items:center}
header{margin:22px 0 28px}h1{margin:0 0 8px;font-size:clamp(26px,5vw,38px);line-height:1.2}header p{margin:0;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{overflow:hidden;border:1px solid var(--line);border-radius:18px;background:var(--panel)}.card img{display:block;width:100%;aspect-ratio:2/3;object-fit:cover;background:#eee}.copy{padding:16px}.copy h2{font-size:19px;margin:0 0 4px}.copy p{margin:0;color:var(--muted)}.note{margin:24px 0 0;padding:16px 18px;border:1px solid var(--line);border-radius:14px;color:var(--muted)}
@media(max-width:760px){main{padding-top:18px}.grid{grid-template-columns:1fr;gap:14px}.card{display:grid;grid-template-columns:minmax(120px,38%) 1fr;align-items:center}.card img{aspect-ratio:2/3}.copy{padding:14px}.copy h2{font-size:18px}}
</style>
</head>
<body><main>
<a class="back" href="./">← 맞고로 돌아가기</a>
<header><h1>화투패 디자인 시안</h1><p>1월 홍단 패를 세 가지 그림체로 살펴보세요.</p></header>
<section class="grid" aria-label="화투패 디자인 세 가지">
<article class="card"><img src="card-style-preview/style-1-cut-paper.jpg" alt="종이 오리기 스타일의 1월 홍단 화투패"><div class="copy"><h2>1. 종이 오리기</h2><p>선명한 색면과 간결한 형태</p></div></article>
<article class="card"><img src="card-style-preview/style-2-friendly.jpg" alt="둥글고 친근한 그림체의 1월 홍단 화투패"><div class="copy"><h2>2. 친근한 벡터</h2><p>부드러운 선과 밝은 분위기</p></div></article>
<article class="card"><img src="card-style-preview/style-3-texture.jpg" alt="질감 있는 포스터 스타일의 1월 홍단 화투패"><div class="copy"><h2>3. 질감 포스터</h2><p>차분한 색감과 종이 질감</p></div></article>
</section>
<p class="note">이 페이지는 스타일 선택을 위한 비교용 시안입니다. 실제 맞고 게임의 패 그림은 아직 바뀌지 않았습니다.</p>
</main></body></html>
